<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工伤事故调查与纠正措施</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}input{padding:.45rem;width:6rem}.flag{color:#b3261e;font-weight:600}</style></head><body><h1>工伤事故调查与纠正措施</h1><p>记录工伤经过、伤害、现场和证人，维护调查、纠正措施、验证与关闭流程</p><p>严重度越高、伤害指数越大、未关闭措施越多或逾期整改越多，优先级越高；严重事故必须在4小时内启动调查。</p><p>整改按待验收台账管理：登记责任人、到期时间和现场证据，安全员验收（不能验收本人提交），证据缺失或事故关键信息变更即退回；事故进入验证前须持有当前版本下的有效验收。</p><button onclick="loadItems()">刷新列表</button> <input id="iid" placeholder="事故ID" value="1"><button onclick="loadLedger()">查看整改台账</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const d=await r.json();for(const i of d.items){i._逾期整改=i.has_overdue_rectifications?'有':'无'}document.getElementById('out').textContent=JSON.stringify(d,null,2)}async function loadLedger(){const id=document.getElementById('iid').value||'1';const r=await fetch(`/api/items/${id}/records`,{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
